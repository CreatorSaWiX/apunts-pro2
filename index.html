  <style>
    html {
      background-color: #0f172a;
    }

    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      background-image: url('data:image/webp;base64,UklGRlgBAABXRUJQVlA4IEwBAADQDQCdASrwAIcAPpFIoU0lpCMiIEgAsBIJaW7hAuE9nqvHMvZz5AKzeirh8/MXUVsn8uejLKAJOaFT0RDVQG2aHVUmu7TV/MW8j8bTN74Mxrlelr+L7wcXw5pDOQHcVRQLnomMfEmpbhaOIvvm+LKDGc8jcs9ZAAD+5RuPgy22KjEYaHVb/T4KpzaboZ837cgmaZuQ3AfJ/358UVn7Kor7PdSWeglnfN6PBnqZbM4phUlVCpp93nLmZD/W3pTt8oXiW3HHPu1UMHJM9cj/ahOwtz1QIbtlKAufGoEur39+8R85ZqgI/6VvmNXkb1zmSE1M2DWUQYWmdTAm5afHnOI3mPL7nWXOxmnQumrDC/WfEhJc8dfb82tQdGbrrxzlRWxMy3QqBSKY5TKH+OKRxeHz/vuIC97FEPVmQ2+C6CrkgsNcEKf5Cafa2gAAAA==');
      background-size: cover;
      background-position: center;
      filter: blur(50px);
      transform: scale(1.4);
      z-index: -1;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      body::before {
        background-image: none;
      }
    }

    #initial-loader h1 {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 2rem;
      letter-spacing: -0.025em;
      background: linear-gradient(to bottom, #ffffff, #c1c7cf, #6f7b8d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
    }

    .spinner-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      position: absolute;
      inset: 0;
      animation: spin 0.8s linear infinite;
      filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.5));
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, transparent 10%, #ffffff 30%, #0ea5e9 100%);
      -webkit-mask-image: radial-gradient(closest-side, transparent calc(100% - 4px - 0.5px), black calc(100% - 4px + 0.5px));
      mask-image: radial-gradient(closest-side, transparent calc(100% - 4px - 0.5px), black calc(100% - 4px + 0.5px));
    }

    .spinner-dot {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background-color: #0ea5e9;
      border-radius: 50%;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loader">
      <h1>APUNTS</h1>
      <div class="spinner-wrapper">
        <div class="spinner">
          <div class="spinner-ring"></div>
          <div class="spinner-dot"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
